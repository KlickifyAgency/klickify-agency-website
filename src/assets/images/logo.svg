<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="200" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#bc13fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main K Shape Framework -->
  <path d="M50 20 V180 M50 100 L120 40 M50 100 L120 160" stroke="url(#logoGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Digital Circuit Lines -->
  <circle cx="50" cy="40" r="4" fill="#00d4ff"/>
  <circle cx="50" cy="80" r="4" fill="#00d4ff"/>
  <circle cx="50" cy="140" r="4" fill="#bc13fe"/>
  <circle cx="90" cy="65" r="4" fill="#00d4ff"/>
  <circle cx="90" cy="135" r="4" fill="#bc13fe"/>
  
  <path d="M60 40 H70 V55" stroke="url(#logoGradient)" stroke-width="3" fill="none"/>
  <path d="M40 140 H30 V125" stroke="url(#logoGradient)" stroke-width="3" fill="none"/>
  <path d="M90 65 L105 52" stroke="url(#logoGradient)" stroke-width="3" fill="none"/>
  
  <!-- Digital Disintegration Pixels (Left side) -->
  <rect x="25" y="30" width="6" height="6" fill="#00d4ff" opacity="0.8"/>
  <rect x="15" y="45" width="5" height="5" fill="#00d4ff" opacity="0.6"/>
  <rect x="20" y="60" width="4" height="4" fill="#00d4ff" opacity="0.4"/>
  <rect x="10" y="75" width="3" height="3" fill="#00d4ff" opacity="0.3"/>
  <rect x="25" y="140" width="6" height="6" fill="#bc13fe" opacity="0.8"/>
  <rect x="15" y="130" width="5" height="5" fill="#bc13fe" opacity="0.6"/>
  
  <!-- Mouse Cursor (Top Right) -->
  <path d="M140 30 L165 55 L150 60 L155 75 L145 78 L140 63 L130 70 Z" fill="#ffffff" stroke="#bc13fe" stroke-width="2"/>
  
</svg>
